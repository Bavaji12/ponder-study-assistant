openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: study
    description: Study assistant generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /study/generate:
    post:
      operationId: generateStudySet
      tags: [study]
      summary: Generate a validated flashcard study set
      description: Sends a study topic or notes to the server-side model and returns structured flashcards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyPromptInput"
      responses:
        "200":
          description: Generated study set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySet"
        "400":
          description: Invalid study prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Model or structured-output failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudyPromptInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 12
          maxLength: 12000
      required:
        - prompt
    StudyCard:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        question:
          type: string
          minLength: 1
        answer:
          type: string
          minLength: 1
        hint:
          type: string
          minLength: 1
        difficulty:
          type: string
          enum: [Foundational, Applied, Advanced]
      required:
        - id
        - question
        - answer
        - hint
        - difficulty
    StudySet:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        topics:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            minLength: 1
        estimatedMinutes:
          type: integer
          minimum: 1
          maximum: 180
        cards:
          type: array
          minItems: 3
          maxItems: 12
          items:
            $ref: "#/components/schemas/StudyCard"
      required:
        - title
        - summary
        - topics
        - estimatedMinutes
        - cards
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

